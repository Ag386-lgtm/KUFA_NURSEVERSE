<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUFA NURSEVERSE | عالم التمريض التفاعلي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body data-page="home">

  <!-- الهيدر -->
  <header class="main-header">
    <div class="header-inner">
      <div class="logos">
        <img id="logoCollege" alt="شعار الكلية" class="logo">
        <img id="logoUniversity" alt="شعار الجامعة" class="logo">
      </div>
      <div class="brand">
        <h1 class="brand-title">KUFA <span>NURSEVERSE</span></h1>
        <p class="brand-sub" id="brandSub">كلية التمريض · جامعة الكوفة</p>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="تبديل المظهر">🌙</button>
        <button id="menuToggle"  class="icon-btn" title="القائمة">☰</button>
      </div>
    </div>
  </header>

  <!-- القائمة الجانبية -->
  <aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <h2>القائمة</h2>
      <button id="closeMenu" class="icon-btn">✕</button>
    </div>
    <nav>
      <a href="index.html" class="active">🏠 الرئيسية</a>
      <a href="pages/departments.html">🔬 الأقسام العلمية</a>
      <a href="pages/events.html">🎉 فعاليات الكلية</a>
      <a href="pages/about.html">ℹ️ عن كلية التمريض</a>
      <a href="pages/contact.html">📞 تواصل معنا</a>
    </nav>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- المحتوى -->
  <main class="home-main">
    <section class="intro-video">
      <div class="video-frame">
        <div id="videoContainer" class="video-placeholder">
          <p>🎬 سيتم تشغيل الفيديو التعريفي هنا</p>
          <small>(أضف YouTube ID في assets/js/config.js)</small>
        </div>
      </div>
    </section>

    <section class="welcome-section">
      <h2 class="welcome-title" id="welcomeTitle"></h2>
      <p class="welcome-tagline" id="welcomeTagline"></p>
      <div class="welcome-body" id="welcomeBody"></div>
      <a id="startBtn" class="btn-start" href="pages/departments.html"></a>
    </section>
  </main>

  <footer class="main-footer">
    <p>© 2026 KUFA NURSEVERSE — كلية التمريض · جامعة الكوفة</p>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
